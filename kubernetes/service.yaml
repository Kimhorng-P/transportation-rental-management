# API Gateway: internal entry point used by NGINX Ingress.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: transportation-rental
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000

---
# Registration: internal access on port 5001.
apiVersion: v1
kind: Service
metadata:
  name: registration-service
  namespace: transportation-rental
spec:
  type: ClusterIP
  selector:
    app: registration
  ports:
    - port: 5001
      targetPort: 5001

---
# Login: internal access on port 5002.
apiVersion: v1
kind: Service
metadata:
  name: login-service
  namespace: transportation-rental
spec:
  type: ClusterIP
  selector:
    app: login
  ports:
    - port: 5002
      targetPort: 5002

---
# Car: distributes connections among the two Car replicas.
apiVersion: v1
kind: Service
metadata:
  name: car-service
  namespace: transportation-rental
spec:
  type: ClusterIP
  selector:
    app: car
  ports:
    - port: 5003
      targetPort: 5003

---
# Availability: internal access on port 5004.
apiVersion: v1
kind: Service
metadata:
  name: availability-service
  namespace: transportation-rental
spec:
  type: ClusterIP
  selector:
    app: availability
  ports:
    - port: 5004
      targetPort: 5004

---
# Booking: internal access on port 5005.
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: transportation-rental
spec:
  type: ClusterIP
  selector:
    app: booking
  ports:
    - port: 5005
      targetPort: 5005

---
# Rental: internal access on port 5006.
apiVersion: v1
kind: Service
metadata:
  name: rental-service
  namespace: transportation-rental
spec:
  type: ClusterIP
  selector:
    app: rental
  ports:
    - port: 5006
      targetPort: 5006

---
# API Ingress: removes /api prefix
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rental-ingress
  namespace: transportation-rental
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: rentalhub.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 3000


---
# Documentation Ingress: separate route
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rental-docs-ingress
  namespace: transportation-rental
spec:
  ingressClassName: nginx
  rules:
    - host: rentalhub.com
      http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: docs-service
                port:
                  number: 8080
