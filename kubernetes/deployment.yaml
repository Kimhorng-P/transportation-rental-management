---
# Car, two replicas allow Service-level load balancing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-deployment
  namespace: transportation-rental
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car
  template:
    metadata:
      labels:
