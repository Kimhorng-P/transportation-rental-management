services:

  api_gateway_1:
    build: ./api_gateway
    env_file:
      - path: ./api_gateway/.env
        required: false
    ports:
      - "3001:3000"
    restart: unless-stopped

  api_gateway_2:
    build: ./api_gateway
    env_file:
      - path: ./api_gateway/.env
        required: false
    ports:
      - "3002:3000"
    restart: unless-stopped

  registration_service:
    build: ./registration_service
    env_file: 
      - path: ./registration_service/.env
        required: false
    environment:
      PORT: "5001"
    ports:
      - "5001:5001"
    restart: unless-stopped

  login_service:
    build: ./login_service
    env_file: 
      - path: ./login_service/.env
        required: false
    environment:
      PORT: "5002"
    ports:
      - "5002:5002"
    restart: unless-stopped

  car_service:
    build: ./car_service
    env_file: 
      - path: ./car_service/.env
        required: false
    environment:
      PORT: "5003"
    ports:
      - "5003:5003"
    restart: unless-stopped

  availability_service:
    build: ./availability_service
    env_file: 
      - path: ./availability_service/.env
        required: false
    environment:
      PORT: "5004"
    ports:
      - "5004:5004"
    restart: unless-stopped

  booking_service:
    build: ./booking_service
    env_file: 
      - path: ./booking_service/.env
        required: false
    environment:
      PORT: "5005"
    ports:
      - "5005:5005"
    restart: unless-stopped
    
  rental_service:
    build: ./rental_service
    env_file: 
      - path: ./rental_service/.env
        required: false
    environment:
      PORT: "5006"
    ports:
      - "5006:5006"
    restart: unless-stopped
  
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - api_gateway_1
      - api_gateway_2
    restart: unless-stopped
