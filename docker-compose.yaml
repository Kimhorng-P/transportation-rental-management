services:

  api_gateway:
    build: ./api_gateway
    env_file: ./api_gateway/.env
    environment:
      PORT: "3000"
      REGISTRATION_SERVICE_URL: http://registration_service:5001
      LOGIN_SERVICE_URL: http://login_service:5002
      CAR_SERVICE_URL: http://car_service:5003
      AVAILABILITY_SERVICE_URL: http://availability_service:5004
      BOOKING_SERVICE_URL: http://booking_service:5005
      RENTAL_SERVICE_URL: http://rental_service:5006
    ports:
      - "3000:3000"
    restart: unless-stopped

  registration_service:
    build: ./registration_service
    env_file: ./registration_service/.env
    environment:
      PORT: "5001"
    ports:
      - "5001:5001"
    restart: unless-stopped

  login_service:
    build: ./login_service
    env_file: ./login_service/.env
    environment:
      PORT: "5002"
    ports:
      - "5002:5002"
    restart: unless-stopped

  car_service:
    build: ./car_service
    env_file: ./car_service/.env
    environment:
      PORT: "5003"
    ports:
      - "5003:5003"
    restart: unless-stopped

  availability_service:
    build: ./availability_service
    env_file: ./availability_service/.env
    environment:
      PORT: "5004"
    ports:
      - "5004:5004"
    restart: unless-stopped

  booking_service:
    build: ./booking_service
    env_file: ./booking_service/.env
    environment:
      PORT: "5005"
    ports:
      - "5005:5005"
    restart: unless-stopped
    
  rental_service:
    build: ./rental_service
    env_file: ./rental_service/.env
    environment:
      PORT: "5006"
    ports:
      - "5006:5006"
    restart: unless-stopped
