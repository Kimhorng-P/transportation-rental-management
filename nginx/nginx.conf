upstream loadbalancer {
    server car_service_1:5003;
    server car_service_2:5003;
}

log_format loadbalancing
    '$remote_addr - "$request" '
    'status=$status upstream=$upstream_addr';

server {
    listen 80;
    server_name localhost;

    access_log /dev/stdout loadbalancing;

    location / {
        proxy_pass http://loadbalancer;

        add_header X-Car-Server $upstream_addr always;
    }
}